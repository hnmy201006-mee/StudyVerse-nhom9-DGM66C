<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dự án cá nhân - StudyVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/projects.css">
</head>
<body data-page="projects">
<header id="navbar" class="navbar"></header>
<main id="content" class="content">
<div class="page-projects">
<header class="projects-header"><h1 class="page-title">Dự án cá nhân</h1><p class="page-sub">Quản lý và theo dõi tiến độ các dự án của bạn</p><button type="button" class="btn btn-primary" id="projectAddBtn">+ Thêm dự án</button></header>
<section class="projects-grid" id="projectGrid"></section>
<div class="modal" id="projectModal" hidden><div class="modal-box"><h2 id="projectModalTitle">Thêm dự án</h2>
<form class="modal-form" id="projectForm"><input type="hidden" id="projectIdInput">
<div class="field"><label for="projectNameInput">Tên dự án</label><input class="input" id="projectNameInput" required></div>
<div class="field"><label for="projectPriorityInput">Ưu tiên</label><select class="input" id="projectPriorityInput"></select></div>
<div class="field"><label for="projectDeadlineInput">Deadline</label><input class="input" type="date" id="projectDeadlineInput" required></div>
<div class="modal-actions"><button type="button" class="btn btn-secondary" id="projectCancelBtn">Hủy</button><button type="submit" class="btn btn-primary">Lưu</button></div>
</form></div></div>
</div>
</main>
<script src="../js/storage.js"></script>
<script src="../js/main.js"></script>
<script src="../js/projects.js"></script>
</body>
</html>
