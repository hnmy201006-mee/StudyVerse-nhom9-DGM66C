<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhiệm vụ - StudyVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/tasks.css">
</head>
<body data-page="tasks">
<header id="navbar" class="navbar"></header>
<main id="content" class="content">
<div class="page-tasks">
<section class="card tasks-card">
<div class="tasks-head"><h1>Danh sách nhiệm vụ</h1><button type="button" class="btn btn-primary" id="taskAddBtn">+ Thêm nhiệm vụ mới</button></div>
<div class="tasks-toolbar">
<input class="input" type="search" id="taskSearchInput" placeholder="Tìm kiếm nhiệm vụ...">
<select class="input" id="taskFilterStatus"><option value="">Mọi trạng thái</option><option value="todo">Chưa triển khai</option><option value="doing">Đang triển khai</option><option value="done">Hoàn thành</option><option value="overdue">Quá hạn</option></select>
<select class="input" id="taskFilterPriority"><option value="">Mọi mức ưu tiên</option><option value="high">Cao</option><option value="medium">Trung bình</option><option value="low">Thấp</option></select>
<select class="input" id="taskFilterCategory"><option value="">Mọi loại</option><option value="study">Học tập</option><option value="work">Công việc</option><option value="personal">Cá nhân</option></select>
<select class="input" id="taskFilterProject"><option value="">Mọi dự án</option><option value="none">Nhiệm vụ lẻ</option></select>
</div>
<div class="table-wrap"><table class="table"><thead><tr><th>Tên nhiệm vụ</th><th>Loại nhiệm vụ</th><th>Ưu tiên</th><th>Deadline</th><th>Thời gian còn lại</th><th>Trạng thái</th><th>Dự án</th><th>Thao tác</th></tr></thead><tbody id="taskTableBody"></tbody></table></div>
<p class="empty" id="taskEmpty" hidden>Không có nhiệm vụ phù hợp.</p>
</section>
<div class="modal" id="taskModal" hidden><div class="modal-box"><h2 id="taskModalTitle">Thêm nhiệm vụ mới</h2>
<form class="modal-form" id="taskForm"><input type="hidden" id="taskIdInput">
<div class="field"><label for="taskTitleInput">Tên nhiệm vụ</label><input class="input" id="taskTitleInput" required></div>
<div class="field"><label for="taskCategoryInput">Loại nhiệm vụ</label><select class="input" id="taskCategoryInput"></select></div>
<div class="field"><label for="taskPriorityInput">Ưu tiên</label><select class="input" id="taskPriorityInput"></select></div>
<div class="field"><label for="taskStatusInput">Trạng thái</label><select class="input" id="taskStatusInput"></select></div>
<div class="field"><label for="taskDeadlineInput">Deadline</label><input class="input" type="date" id="taskDeadlineInput" required></div>
<div class="field"><label for="taskDeadlineTimeInput">Giờ deadline</label><input class="input" type="time" id="taskDeadlineTimeInput" value="23:59" required></div>
<div class="field"><label for="taskProjectInput">Dự án</label><select class="input" id="taskProjectInput"></select></div>
<div class="modal-actions"><button type="button" class="btn btn-secondary" id="taskCancelBtn">Hủy</button><button type="submit" class="btn btn-primary">Lưu</button></div>
</form></div></div>
</div>
</main>
<script src="../js/storage.js"></script>
<script src="../js/main.js"></script>
<script src="../js/tasks.js"></script>
</body>
</html>
